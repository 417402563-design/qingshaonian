spring.application.name=qingshaonian
server.port=8080

# ===================== 内地 MySQL 配置 =====================
# createDatabaseIfNotExist=true 支持自动建库；utf8 编码；Asia/Shanghai 时区
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/qingshaonian_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ===================== JWT 配置 =====================
jwt.secret=qingshaonian-psychology-counsel-system-secret-key-2026-sdua-edu-cn
jwt.expire-hours=72

# ===================== DeepSeek 大模型配置 =====================
# 请将 api-key 替换为你在 https://platform.deepseek.com 申请的密钥
# 未填写时智能咨询自动降级为本地知识库模板回答
deepseek.api-key=
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
deepseek.timeout-seconds=60

# ===================== 其他 =====================
spring.jackson.time-zone=Asia/Shanghai
spring.servlet.multipart.max-file-size=10MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
